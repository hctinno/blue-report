# 블루 리포트 릴리스
#
# v 로 시작하는 태그(예: v1.12.0)를 올리면 Codex 설치 묶음을 만들어 릴리스에 붙인다.
# Codex 설치 지침(INSTALL.md)은 최신 릴리스의 blue-report-codex.zip 을 받으므로,
# 판을 올린 뒤 이 태그를 올려야 직원 설치본이 새 판을 받는다.
#
#     git tag v1.12.0 <main 커밋> && git push origin v1.12.0
#
# 릴리스 설명은 .github/release-notes/<태그>.md 가 있으면 그것을, 없으면 CHANGELOG.md 의 해당 판 절을 쓴다.

name: 릴리스

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Codex 설치 묶음 · 릴리스
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 태그와 스킬 판번호가 다르면 엉뚱한 판이 「최신」이 된다. 여기서 멈춘다.
      - name: 판번호 대조
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(python -c "import json;print(json.load(open('.claude/skills/blue-report/.claude-plugin/plugin.json'))['version'])")
          echo "태그 $tag · plugin.json $ver"
          test "$tag" = "$ver"

      - name: 설치 묶음 만들기
        run: python scripts/install_codex_skill.py --bundle dist-release/blue-report-codex.zip

      # INSTALL.md 가 요구하는 필수 파일 · 경로 안전 · 내장 판번호를 확인한다.
      - name: 설치 묶음 확인
        run: |
          python - <<'PY'
          import json, os, zipfile
          z = zipfile.ZipFile("dist-release/blue-report-codex.zip")
          names = z.namelist()
          need = ["blue-report/SKILL.md", "blue-report/agents/openai.yaml", "blue-report/brand/hct/brand.json",
                  "blue-report/scripts/style_previews.py", "blue-report/scripts/check_pptx.py",
                  "blue-report/INSTALLATION.json"]
          missing = [n for n in need if n not in names]
          assert not missing, f"빠진 파일: {missing}"
          assert not any(n.startswith("/") or ".." in n.split("/") for n in names), "묶음 밖 경로"
          info = json.loads(z.read("blue-report/INSTALLATION.json"))
          tag = os.environ["GITHUB_REF_NAME"][1:]
          assert info["upstream_version"] == tag, f"내장 판번호 {info['upstream_version']} ≠ {tag}"
          assert info["commit"] == os.environ["GITHUB_SHA"], "원본 커밋 불일치"
          print(f"파일 {len(names)}개 · 판 {tag} · 커밋 {info['commit'][:7]}")
          PY
          sha256sum dist-release/blue-report-codex.zip

      - name: 릴리스 설명
        run: |
          notes=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then cp "$notes" dist-release/notes.md; else
            python - <<'PY' > dist-release/notes.md
          import os, re
          tag = os.environ["GITHUB_REF_NAME"][1:]
          log = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## " + re.escape(tag) + r"\b.*?\n(.*?)(?=^## |\Z)", log, re.S | re.M)
          print((m.group(1).strip() if m else "변경 이력은 CHANGELOG.md 를 본다.") + "\n\n[설치·시작 지침](https://github.com/hctinno/blue-report/blob/main/INSTALL.md)")
          PY
          fi

      - name: 릴리스 만들기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title=$(head -1 ".github/release-notes/${GITHUB_REF_NAME}.title" 2>/dev/null || echo "블루 리포트 ${GITHUB_REF_NAME}")
          gh release create "$GITHUB_REF_NAME" dist-release/blue-report-codex.zip \
            --title "$title" --notes-file dist-release/notes.md --latest --verify-tag
