# 블루 리포트 릴리스
#
# main 에 들어온 스킬 판번호(plugin.json)의 릴리스가 아직 없으면 Codex 설치 묶음을 만들어
# 「v판번호」 태그와 릴리스를 새로 만든다. 판번호를 올린 PR 을 머지하면 릴리스가 따라 나온다.
# Codex 설치 지침(INSTALL.md)은 최신 릴리스의 blue-report-codex.zip 을 받는다.
# v 태그를 직접 올려도 같은 일을 한다(이미 릴리스가 있으면 건너뛴다).
#
# 릴리스 설명은 .github/release-notes/<태그>.md 가 있으면 그것을, 없으면 CHANGELOG.md 의 해당 판 절을 쓴다.

name: 릴리스

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Codex 설치 묶음 · 릴리스
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # 릴리스할 판 — 태그로 왔으면 태그, 아니면 plugin.json. 이미 릴리스가 있으면 이후 단계를 건너뛴다.
      - name: 릴리스할 판
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(python3 -c "import json;print(json.load(open('.claude/skills/blue-report/.claude-plugin/plugin.json'))['version'])")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then tag="$GITHUB_REF_NAME"; else tag="v$ver"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "skip=1" >> "$GITHUB_OUTPUT"; echo "$tag 릴리스가 이미 있다 — 건너뛴다"
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"; echo "$tag 릴리스를 만든다"
          fi

      - name: Python
        if: steps.ver.outputs.skip == '0'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 태그와 스킬 판번호가 다르면 엉뚱한 판이 「최신」이 된다. 여기서 멈춘다.
      - name: 판번호 대조
        if: steps.ver.outputs.skip == '0'
        run: |
          tag="${TAG#v}"
          ver=$(python -c "import json;print(json.load(open('.claude/skills/blue-report/.claude-plugin/plugin.json'))['version'])")
          echo "태그 $tag · plugin.json $ver"
          test "$tag" = "$ver"
        env:
          TAG: ${{ steps.ver.outputs.tag }}

      - name: 설치 묶음 만들기
        if: steps.ver.outputs.skip == '0'
        run: python scripts/install_codex_skill.py --bundle dist-release/blue-report-codex.zip

      # INSTALL.md 가 요구하는 필수 파일 · 경로 안전 · 내장 판번호를 확인한다.
      - name: 설치 묶음 확인
        if: steps.ver.outputs.skip == '0'
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          python - <<'PY'
          import json, os, zipfile
          z = zipfile.ZipFile("dist-release/blue-report-codex.zip")
          names = z.namelist()
          need = ["blue-report/SKILL.md", "blue-report/agents/openai.yaml", "blue-report/brand/hct/brand.json",
                  "blue-report/scripts/style_previews.py", "blue-report/scripts/check_pptx.py",
                  "blue-report/INSTALLATION.json"]
          missing = [n for n in need if n not in names]
          assert not missing, f"빠진 파일: {missing}"
          assert not any(n.startswith("/") or ".." in n.split("/") for n in names), "묶음 밖 경로"
          info = json.loads(z.read("blue-report/INSTALLATION.json"))
          tag = os.environ["TAG"][1:]
          assert info["upstream_version"] == tag, f"내장 판번호 {info['upstream_version']} ≠ {tag}"
          assert info["commit"] == os.environ["GITHUB_SHA"], "원본 커밋 불일치"
          print(f"파일 {len(names)}개 · 판 {tag} · 커밋 {info['commit'][:7]}")
          PY
          sha256sum dist-release/blue-report-codex.zip

      - name: 릴리스 설명
        if: steps.ver.outputs.skip == '0'
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          notes=".github/release-notes/${TAG}.md"
          if [ -f "$notes" ]; then cp "$notes" dist-release/notes.md; else
            python - <<'PY' > dist-release/notes.md
          import os, re
          tag = os.environ["TAG"][1:]
          log = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## " + re.escape(tag) + r"\b.*?\n(.*?)(?=^## |\Z)", log, re.S | re.M)
          print((m.group(1).strip() if m else "변경 이력은 CHANGELOG.md 를 본다.") + "\n\n[설치·시작 지침](https://github.com/hctinno/blue-report/blob/main/INSTALL.md)")
          PY
          fi

      - name: 릴리스 만들기
        if: steps.ver.outputs.skip == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          title=$(head -1 ".github/release-notes/${TAG}.title" 2>/dev/null || echo "블루 리포트 ${TAG}")
          # 태그가 없으면 이 커밋에 만든다(main 머지로 온 경우)
          gh release create "$TAG" dist-release/blue-report-codex.zip --target "$GITHUB_SHA" \
            --title "$title" --notes-file dist-release/notes.md --latest
